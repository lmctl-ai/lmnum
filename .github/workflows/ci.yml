name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

# Least privilege: build jobs (which run third-party npm install scripts)
# only read; the release job alone gets contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    # Job-level `if` is evaluated before matrix expansion, so the 'only'
    # filter lives on the steps (runner spin-up for skipped jobs is seconds).
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash # pwsh/zsh would silently skip the sync scripts on some runners
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false # no token in .git/config for npm scripts

      - name: fetch pinned dependencies (deps.lock), verify vendored sdk header
        timeout-minutes: 5
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        timeout-minutes: 5
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils

      - name: toolchain (windows)
        timeout-minutes: 10
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        shell: bash
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            for i in 1 2 3; do
              choco install -y mingw ninja && break
              echo "choco attempt $i failed; retrying"; sleep 20
            done
          fi
          command -v g++ >/dev/null 2>&1 || { echo "no mingw g++ on PATH"; exit 1; }
          g++ --version | head -1

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          if [ -x /usr/bin/timeout ]; then deadline=/usr/bin/timeout
          elif command -v gtimeout >/dev/null 2>&1; then deadline=gtimeout
          else deadline=timeout; fi
          "$deadline" 180 npm i -g @lmctl-ai/lmctl@0.2.420
          "$deadline" 180 scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v5 compiler available"; exit 1; }

      - name: python3 shim (windows)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        env:
          LMNUM_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -x /usr/bin/timeout ]; then deadline=/usr/bin/timeout
          elif command -v gtimeout >/dev/null 2>&1; then deadline=gtimeout
          else deadline=timeout; fi
          "$deadline" 1800 ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "build/lmnum$ext" "dist/lmnum-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmnum-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmnum-*
          path: dist
          merge-multiple: true

      - name: tag matches lmnum --version (lmscript @latest compares them)
        run: |
          chmod +x dist/lmnum-linux-x64
          got="$(timeout 20 dist/lmnum-linux-x64 --version)"
          test "$got" = "lmnum ${GITHUB_REF_NAME#v}" || { echo "::error::tag $GITHUB_REF_NAME but binary says '$got' (bump project VERSION in CMakeLists.txt)"; exit 1; }

      - name: generate binary checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'lmnum-*' ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exactly five binary assets; licenses are embedded, checksums are in notes.
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Linux binaries require glibc >= 2.35 and dynamically link only system glibc.
          C++ runtimes and mathematical libraries remain static. All five platforms passed CI.

          v0.1.4 supersedes v0.1.3. v0.1.3 shipped unsupported musl static-pie binaries;
          its libc experiment is withdrawn and no longer supported. Use v0.1.4 or later.

          Licenses are embedded: `lmnum --notices`.

          SHA256 checksums:
          ```text
          NOTES
          cat dist/SHA256SUMS >> "$RUNNER_TEMP/release-notes.md"
          printf '\n```\n' >> "$RUNNER_TEMP/release-notes.md"
          if timeout 30 gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            timeout 120 gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/lmnum-*
            timeout 30 gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            timeout 120 gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" dist/lmnum-*
          fi
